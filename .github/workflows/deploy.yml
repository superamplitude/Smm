name: Deploy SMM SuperAmplitude

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source
    runs-on: [self-hosted, smm, production]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate source
        run: |
          node --version
          npm --version
          node --check server.js
          node --check public/app.js
          node --check public/admin/admin.js
          node --check src/ai.js
          node --check src/suppliers.js
          node --check src/secrets.js
          node --check src/admin-integrations.js
          npm test

  deploy:
    name: Production deploy
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: [self-hosted, smm, production]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy locally on VPS
        run: |
          chmod +x deploy/deploy.sh
          deploy/deploy.sh

      - name: Verify production health
        run: |
          curl -fsS http://127.0.0.1:3008/health
          curl -fsS http://127.0.0.1:3008/ready
          curl -fsSI https://smm.superamplitude.com >/dev/null
          curl -fsS https://smm.superamplitude.com/admin/ | grep -q 'Adicionar servidor'

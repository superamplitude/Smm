name: Deploy SMM SuperAmplitude

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source
    runs-on: [self-hosted, smm, production]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Validate source
        run: |
          node --version
          npm --version
          node --check server.js
          node --check public/app.js
          node --check public/panel/panel.js
          node --check public/admin/admin.js
          node --check public/admin/admin-layout.js
          node --check src/ai.js
          node --check src/suppliers.js
          node --check src/secrets.js
          node --check src/admin-integrations.js
          npm test

      - name: Build dependency lock and security audit
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-fund
          fi
          npm audit --omit=dev --audit-level=high

      - name: Persist generated dependency lock
        if: ${{ github.event_name != 'pull_request' && hashFiles('package-lock.json') != '' }}
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name 'smm-production-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: lock audited production dependencies [skip ci]'
          git push origin HEAD:main

  deploy:
    name: Production deploy
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: [self-hosted, smm, production]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy locally on VPS
        run: |
          chmod +x deploy/deploy.sh
          deploy/deploy.sh

      - name: Verify production health and security
        run: |
          curl -fsS http://127.0.0.1:3008/health
          curl -fsS http://127.0.0.1:3008/ready
          curl -fsSI https://smm.superamplitude.com >/tmp/smm-headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/smm-headers.txt
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://smm.superamplitude.com/api/dashboard)" = "401"
          curl -fsS https://smm.superamplitude.com/api/services | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const j=JSON.parse(s);if(!Array.isArray(j))process.exit(1)})'
          curl -fsS https://smm.superamplitude.com/ | grep -q 'Pedido direto no fornecedor'
          curl -fsS https://smm.superamplitude.com/panel/ | grep -q 'Novo pedido'
          curl -fsS https://smm.superamplitude.com/panel/panel.js | grep -q '/api/dashboard'
          curl -fsS https://smm.superamplitude.com/admin/ | grep -q 'Adicionar API Provider'
          curl -fsS https://smm.superamplitude.com/admin/admin-layout.js | grep -q 'active-page'
          rm -f /tmp/smm-headers.txt
